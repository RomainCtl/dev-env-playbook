---
- name: Initialize WSL2 Ubuntu Dev Environment
  hosts: local
  vars_files:
    - vars/main.yml

  vars_prompt:
    - name: github_user_name
      prompt: "Git global user.name"
      default: "{{ github_user_name }}"
      private: false
    - name: github_user_email
      prompt: "Git global user.email"
      default: "{{ github_user_email }}"
      private: false

  roles:
    - { role: base, become: true }
    - { role: homebrew }
    - { role: shell }
    - { role: sdkman_java }
    - { role: nvm_node }
    - { role: python, become: true }
    - { role: rust }
    - { role: docker, become: true }
    - { role: vscode, become: true }
