---
- name: Check if Homebrew is already installed
  stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: brew_installed

- name: Install Homebrew (Linuxbrew)
  shell: >
    NONINTERACTIVE=1 /bin/bash -c
    "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not brew_installed.stat.exists
  environment:
    NONINTERACTIVE: "1"

- name: Ensure Homebrew shellenv is sourced in .zshrc
  blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED HOMEBREW BLOCK"
    block: |
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
    create: yes

- name: Install brew packages
  shell: >
    bash -c "eval \"$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)\" &&
    brew install {{ item }}"
  args:
    creates: "/home/linuxbrew/.linuxbrew/bin/{{ item }}"
  loop: "{{ brew_packages }}"

- name: Run brew doctor (informational, non-failing)
  shell: >
    bash -c "eval \"$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)\" &&
    brew doctor"
  register: brew_doctor_result
  changed_when: false
  ignore_errors: true

- name: Show brew doctor output
  debug:
    msg: "{{ brew_doctor_result.stdout_lines }}"
