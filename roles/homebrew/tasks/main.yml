---
- name: Check if Homebrew is already installed
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: homebrew_installed

- name: Install Homebrew (Linuxbrew)
  ansible.builtin.shell: >
    set -o pipefail &&
    NONINTERACTIVE=1 /bin/bash -c
    "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not homebrew_installed.stat.exists
  environment:
    NONINTERACTIVE: "1"
  changed_when: true

- name: Ensure Homebrew shellenv is sourced in .zshrc
  ansible.builtin.blockinfile:
    path: "/home/{{ ansible_facts['user_id'] }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED HOMEBREW BLOCK"
    block: |
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

- name: Install brew packages
  community.general.homebrew:
    name: "{{ brew_packages }}"
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  become: false

- name: Run brew doctor (informational, non-failing)
  ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/brew doctor
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:{{ ansible_facts['env']['PATH'] }}"
  register: homebrew_doctor_result
  changed_when: false
  ignore_errors: true

- name: Show brew doctor output
  ansible.builtin.debug:
    msg: "{{ homebrew_doctor_result.stdout_lines }}"
