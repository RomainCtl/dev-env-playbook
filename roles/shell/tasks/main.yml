---
- name: Install zsh, oh-my-zsh dependencies
  ansible.builtin.apt:
    name:
      - zsh
      - fonts-powerline
    state: present
  become: true

- name: Check if oh-my-zsh is already installed
  ansible.builtin.stat:
    path: "/home/{{ USERNAME }}/.oh-my-zsh"
  register: shell_ohmyzsh_installed

- name: Download oh-my-zsh installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/ohmyzsh_install.sh
    mode: '0755'
  when: not shell_ohmyzsh_installed.stat.exists

- name: Install oh-my-zsh
  ansible.builtin.shell: >
    set -o pipefail &&
    bash /tmp/ohmyzsh_install.sh --unattended
  when: not shell_ohmyzsh_installed.stat.exists
  environment:
    RUNZSH: "no"
    CHSH: "no"
  changed_when: true

- name: Clone Powerlevel10k theme
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "/home/{{ USERNAME }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1
    version: master

- name: Set ZSH_THEME to powerlevel10k in .zshrc
  ansible.builtin.lineinfile:
    path: "/home/{{ USERNAME }}/.zshrc"
    regexp: '^ZSH_THEME='
    line: 'ZSH_THEME="powerlevel10k/powerlevel10k"'
    create: true

# --- Restore YOUR existing p10k config instead of prompting fresh setup ---

- name: Copy oh-my-zsh custom scripts
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/home/{{ USERNAME }}/.oh-my-zsh/custom'
    mode: 'u=rwx,g=r,o=r'
  with_fileglob: '{{ role_path }}/files/.oh-my-zsh/custom/*.zsh'

- name: Set ZSH_CUSTOM
  ansible.builtin.lineinfile:
    path: "/home/{{ USERNAME }}/.zshrc"
    insertafter: '# ZSH_CUSTOM'
    line: 'ZSH_CUSTOM=/home/{{ USERNAME }}/.oh-my-zsh/custom'
