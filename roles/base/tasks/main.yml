---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present

- name: Set git global user.name
  become: false
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ github_user_name }}"
  when: (github_user_name is defined) and (github_user_name | length > 0)

- name: Set git global user.email
  become: false
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ github_user_email }}"
  when: (github_user_email is defined) and (github_user_email | length > 0)

- name: Set git default branch name to main
  become: false
  community.general.git_config:
    name: init.defaultBranch
    scope: global
    value: main
