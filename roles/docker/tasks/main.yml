---
- name: Remove old docker packages if present
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: absent

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['ansible_distribution_release'] }} stable
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: true
    state: present

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_facts['ansible_user_id'] }}"
    groups: docker
    append: true

- name: Enable Docker service (systemd must be active in WSL2)
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Note about WSL2 systemd
  ansible.builtin.debug:
    msg: >
      If this failed, ensure /etc/wsl.conf has [boot] systemd=true and
      restart WSL (`wsl --shutdown` from Windows), or start dockerd manually.
