---
- name: Remove old docker packages if present
  apt:
    name:
      - docker.io
      - docker-compose
    state: absent

- name: Add Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  apt_repository:
    repo: >
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: yes
    state: present

- name: Add current user to docker group
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes

- name: Enable Docker service (if systemd is active in WSL2)
  systemd:
    name: docker
    enabled: yes
    state: started
  ignore_errors: true   # Older WSL2 without systemd support will fail gracefully

- name: Note about WSL2 systemd
  debug:
    msg: >
      If this failed, ensure /etc/wsl.conf has [boot] systemd=true and
      restart WSL (`wsl --shutdown` from Windows), or start dockerd manually.
