---
- name: Check if 'code' CLI is available (from Windows VS Code + Remote-WSL)
  ansible.builtin.command: which code
  register: vscode_cli
  ignore_errors: true
  changed_when: false

- name: Install VS Code extensions
  ansible.builtin.command: "code --install-extension {{ item }}"
  loop: "{{ vscode_extensions }}"
  when: vscode_cli.rc == 0
  changed_when: true

- name: Warn if code CLI not found
  ansible.builtin.debug:
    msg: >
      'code' command not found in PATH. Install VS Code on Windows with the
      "Remote - WSL" extension, then open a folder from WSL once via
      `code .` to register the CLI shim in this distro's PATH.
  when: vscode_cli.rc != 0
