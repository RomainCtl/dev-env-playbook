---
- name: Check if rustup is installed
  stat:
    path: "{{ ansible_env.HOME }}/.cargo/bin/rustc"
  register: rustup_installed

- name: Install rustup + stable toolchain
  shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  when: not rustup_installed.stat.exists

- name: Ensure cargo env sourced in .zshrc
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: '. "$HOME/.cargo/env"'
    create: yes

- name: Install common cargo components
  shell: >
    bash -c "source {{ ansible_env.HOME }}/.cargo/env &&
    rustup component add clippy rustfmt"
