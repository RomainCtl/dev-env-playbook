---
- name: Check if rustup is installed
  ansible.builtin.stat:
    path: "/home/{{ USERNAME }}/.cargo/bin/rustc"
  register: rust_installed

- name: Download rustup installer
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup_install.sh
    mode: '0755'
  when: not rust_installed.stat.exists

- name: Install rustup + stable toolchain
  ansible.builtin.shell: >
    set -o pipefail &&
    bash /tmp/rustup_install.sh -y
  when: not rust_installed.stat.exists
  changed_when: true

- name: Ensure cargo env sourced in .zshrc
  ansible.builtin.lineinfile:
    path: "/home/{{ USERNAME }}/.zshrc"
    line: '. "$HOME/.cargo/env"'
    create: true
    mode: '0644'

- name: Install common cargo components
  ansible.builtin.shell: >
    bash -c "source /home/{{ USERNAME }}/.cargo/env &&
    rustup component add clippy rustfmt"
  changed_when: true
