apt_packages:
  - build-essential
  - curl
  - wget
  - file
  - git
  - unzip
  - zip
  - htop
  - ripgrep
  - fd-find
  - fzf
  - tmux
  - ca-certificates
  - gnupg
  - lsb-release
  - software-properties-common
  - pkg-config
  - libssl-dev

brew_packages:
  - git
  - gh              # GitHub CLI
  - lazygit         # terminal git UI
  - k9s             # kubernetes TUI (if relevant)
  - httpie
  - watch
  - tldr
  - bat             # better cat
  - eza             # better ls
  - dust            # better du
  - jq
  - jd
  - dive
  - helm
  - kubernetes-cli
  - openshift-cli
  - pipenv
  - ansible-lint
  - imagemagick

curl_installers:
  - name: mammouth
    url: https://code.mammouth.ai/install.sh
    creates: "/home/{{ ansible_facts['user_id'] }}/.mammouth/bin"

  - name: redis-cli
    url: https://packages.redis.io/redis-cli/install.sh
    creates: "/home/{{ ansible_facts['user_id'] }}/.local/bin/redis-cli"

java_versions:
  - "25.0.4-tem"

node_versions:
  - "24"
  - "22"
default_node_version: "24"

python_apt_packages:
  - python3
  - python3-pip
  - python3-venv
  - python3-dev
  - pipx

vscode_extensions:
  - ms-vscode-remote.remote-wsl
  - davidanson.vscode-markdownlint
  - saoudrizwan.claude-dev
  - redhat.java
  - vscjava.vscode-maven
  - vscjava.vscode-java-debug
  - ms-python.python
  - rust-lang.rust-analyzer
  - ms-azuretools.vscode-docker
  - eamodio.gitlens
  - esbenp.prettier-vscode
  - editorconfig.editorconfig
